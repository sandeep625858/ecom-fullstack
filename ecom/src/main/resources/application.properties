spring.application.name=ecom

logging.pattern.console=%green(%d{HH:mm:ss.SSS}) %blue(%-5level) %red([%thread]) %yellow(%logger{15}) - %msg%n
logging.level.root=${LOG_LEVEL:INFO}
logging.file.name=${LOG_FILE_NAME:D:/setup/Project_intellij/fullstack-react-springboot/log/app.log}
logging.pattern.file={"timestamp":"%d{yyyy-MM-dd HH:mm:ss}","level":"%p","logger":"%c","message":"%m"}


spring.datasource.url=jdbc:oracle:thin:@${DATABASE_HOST:localhost}:${DATABASE_PORT:1521}/${DATABASE_SERVICE_NAME:XEPDB1}
spring.datasource.username=${DATABASE_USERNAME:springuser}
spring.datasource.password=${DATABASE_PASSWORD:spring123}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

spring.jpa.database-platform=org.hibernate.dialect.OracleDialect
spring.jpa.show-sql=${JPA_SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=${HIBERNATE_FORMAT_SQL:true}

# Recommended during development
spring.jpa.hibernate.ddl-auto=update

management.endpoint.health.show-details=always
management.endpoints.web.base-path=/store/actuator
management.endpoints.web.exposure.include=*

